<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -100 200 200">
  <defs>
    <clipPath id="vbClip"><circle r="96"/></clipPath>
    <radialGradient id="vbShade" cx="35%" cy="30%" r="85%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
    </radialGradient>
  </defs>

  <circle r="96" fill="#f3f6fa"/>

  <g clip-path="url(#vbClip)">
    <!-- Три «меридиана» волейбольного мяча: цветные заливки-эллипсы,
         повёрнутые на 0°/60°/−60°. Центр всегда (0,0), так что рисунок
         симметричен и полностью закрывает круг. -->
    <ellipse rx="100" ry="30" fill="#1a3c7a" transform="rotate(60)"/>
    <ellipse rx="100" ry="30" fill="#f5c43a" transform="rotate(-60)"/>
    <!-- Горизонтальная полоса остаётся белой (базовая заливка). -->

    <!-- Контуры-швы поверх, чтобы панели читались как объём. -->
    <g fill="none" stroke="#0b1f3f" stroke-width="5.5" stroke-linecap="round">
      <ellipse rx="96" ry="30"/>
      <ellipse rx="96" ry="30" transform="rotate(60)"/>
      <ellipse rx="96" ry="30" transform="rotate(-60)"/>
    </g>

    <!-- Радиальная подсветка сверху-слева + затемнение по краям. -->
    <circle r="96" fill="url(#vbShade)"/>
  </g>

  <circle r="96" fill="none" stroke="#0b1f3f" stroke-width="4.5"/>
</svg>
